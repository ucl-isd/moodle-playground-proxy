name: Rate limit
# Run by hand after a deploy. The runner's address is blocked for 1 minute,
# which is why this runs here and not from the UCL network.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  rate-limit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run check:rate-limit
